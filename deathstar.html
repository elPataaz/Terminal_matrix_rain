<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LearnIX — Death Star Matrix Rain</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; overflow:hidden; font-family:monospace; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
'use strict';

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

// ═══════════════════════════════════════════════
//  IMPERIAL MARCH — Web Audio API
// ═══════════════════════════════════════════════
let audioCtx = null;
let marchPlaying = false;
let marchStop = false;

function playNote(freq, start, dur, vol=0.18) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, start);
  gain.gain.linearRampToValueAtTime(vol, start + 0.01);
  gain.gain.setValueAtTime(vol, start + dur - 0.02);
  gain.gain.linearRampToValueAtTime(0, start + dur);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(start);
  osc.stop(start + dur);
}

function playMarch() {
  if (marchPlaying) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  marchPlaying = true;
  marchStop = false;

  // G4 G4 G4 Eb4 Bb4 G4 Eb4 Bb4 G4
  const G4=392, Eb4=311.1, Bb4=466.2;
  const notes = [
    [G4,.40,.10],[G4,.40,.10],[G4,.40,.10],
    [Eb4,.28,.05],[Bb4,.12,.05],
    [G4,.40,.10],
    [Eb4,.28,.05],[Bb4,.12,.05],
    [G4,.60,.30],
  ];

  function scheduleLoop() {
    if (marchStop) { marchPlaying = false; return; }
    let t = audioCtx.currentTime + 0.05;
    for (const [freq, dur, pause] of notes) {
      playNote(freq, t, dur);
      t += dur + pause;
    }
    setTimeout(scheduleLoop, t * 1000 - Date.now() + audioCtx.currentTime * 1000 - 200);
  }

  // Schedule with proper timing
  function loopMarch() {
    if (marchStop) { marchPlaying = false; return; }
    let t = audioCtx.currentTime + 0.05;
    for (const [freq, dur, pause] of notes) {
      playNote(freq, t, dur);
      t += dur + pause;
    }
    const loopLen = notes.reduce((s, n) => s + n[1] + n[2], 0) * 1000;
    setTimeout(loopMarch, loopLen);
  }
  loopMarch();
}

function stopMarch() {
  marchStop = true;
  if (audioCtx) {
    audioCtx.close().catch(()=>{});
    audioCtx = null;
  }
  marchPlaying = false;
}

canvas.width  = window.innerWidth;
canvas.height = window.innerHeight;
const W = canvas.width, H = canvas.height;

const FS   = 14;
const COLS = (W / FS) | 0;
const ROWS = (H / FS) | 0;

const CHARS = 'ｦｧｨｩｪｫｬｭｮｯｰｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789@#$%&*';
const rc = () => CHARS[Math.random() * CHARS.length | 0];

// ═══════════════════════════════════════════════
//  DEATH STAR GEOMETRY
// ═══════════════════════════════════════════════
const CX = COLS * 0.5;
const CY = ROWS * 0.5;
const R  = Math.min(COLS, ROWS) * 0.40;

// ── Curved trench — front face only, parabolic arc ──
const TRENCH_THICK = R * 0.04;

function inTrench(c, r) {
  const dx = c - CX, dy = r - CY;
  const d2 = dx*dx + dy*dy;
  if (d2 > R*R) return false;
  const z2 = R*R - d2;
  if (z2 <= 0) return false;
  const z = Math.sqrt(z2);
  if (z < R * 0.3) return false;
  const curveY = 0.15 * R * (1.0 - (dx/R)*(dx/R));
  return Math.abs(dy - curveY) < TRENCH_THICK;
}

// ── Dish — upper-left, nearly round, black void ──
const DCX = CX - R * 0.34;
const DCY = CY - R * 0.36;
const DRX = R * 0.24;
const DRY = R * 0.22;

function dishVal(c, r) {
  const ex = c - DCX, ey = r - DCY;
  return (ex/DRX)*(ex/DRX) + (ey/DRY)*(ey/DRY);
}

function inShape(c, r) {
  const dx = c - CX, dy = r - CY;
  if (dx*dx + dy*dy > R*R) return false;
  if (inTrench(c, r)) return false;
  if (dishVal(c, r) <= 1) return false;
  return true;
}

// ── 3D shading ──
function shadeFactor(c, r) {
  const dx = c - CX, dy = r - CY;
  const d2 = dx*dx + dy*dy;
  if (d2 >= R*R) return 0;
  return Math.sqrt(Math.max(0, 1.0 - d2/(R*R)));
}

// ── Per-column valid rows (bottom → top) ──
const colRows = Array.from({length:COLS}, () => []);
const maskGrid = Array.from({length:ROWS}, (_, r) =>
  Uint8Array.from({length:COLS}, (_, c) => inShape(c, r) ? 1 : 0));
const trenchGrid = Array.from({length:ROWS}, (_, r) =>
  Uint8Array.from({length:COLS}, (_, c) => inTrench(c, r) ? 1 : 0));
const shadeGrid = Array.from({length:ROWS}, (_, r) =>
  Float32Array.from({length:COLS}, (_, c) => shadeFactor(c, r)));

for (let c = 0; c < COLS; c++)
  for (let r = ROWS-1; r >= 0; r--)
    if (maskGrid[r][c]) colRows[c].push(r);

// ── Edge cells ──
const edgeCells = [];
for (let r = 1; r < ROWS-1; r++) {
  for (let c = 1; c < COLS-1; c++) {
    const dx = c - CX, dy = r - CY;
    const d2 = dx*dx + dy*dy;

    if (maskGrid[r][c] && (
      !maskGrid[r-1][c] || !maskGrid[r+1][c] ||
      !maskGrid[r][c-1] || !maskGrid[r][c+1])) {
      edgeCells.push({c, r, ch: rc(), type:'outer'});
      continue;
    }

    if (trenchGrid[r][c] && d2 <= R*R) {
      const adj = (r>0 && maskGrid[r-1][c]) || (r<ROWS-1 && maskGrid[r+1][c]) ||
                  (c>0 && maskGrid[r][c-1]) || (c<COLS-1 && maskGrid[r][c+1]);
      if (adj) { edgeCells.push({c, r, ch: rc(), type:'trench'}); continue; }
    }

    const dv = dishVal(c, r);
    if (d2 <= R*R && !inTrench(c, r) && dv >= 0.7 && dv <= 1.3)
      edgeCells.push({c, r, ch: rc(), type:'dish'});
  }
}

// ═══════════════════════════════════════════════
//  RAIN STATE
// ═══════════════════════════════════════════════
const stacks = Array.from({length:COLS}, () => []);
const drops  = Array.from({length:COLS}, () => []);

// Phases: RAIN → FILL → DRAIN → HOLD → FADE → DONE
const Phase = { RAIN:0, FILL:1, DRAIN:2, HOLD:3, FADE:4, DONE:5 };
let phase     = Phase.RAIN;
let phaseWait = 0;
let frame     = 0;
let fadeAlpha  = 0;
let firstLanded = false;

const HOLD_FRAMES = 120;  // 3 sec

function spawnDrop(c) {
  drops[c].push({
    y:     -(Math.random() * ROWS * 0.6),
    speed: 0.12 + Math.random() * 0.45,
    chars: Array.from({length: 5 + (Math.random()*22|0)}, rc),
    bright: Math.random() > 0.85
  });
}

for (let c = 0; c < COLS; c++)
  if (Math.random() < 0.28) spawnDrop(c);

// ═══════════════════════════════════════════════
//  UPDATE
// ═══════════════════════════════════════════════
function update() {
  frame++;

  if (frame % 7 === 0 && edgeCells.length) {
    const e = edgeCells[Math.random() * edgeCells.length | 0];
    e.ch = rc();
  }

  // Spawn
  if (phase <= Phase.FILL) {
    for (let c = 0; c < COLS; c++)
      if (Math.random() < 0.035 && drops[c].length < 4) spawnDrop(c);
  }

  // Move drops
  firstLanded = false;
  for (let c = 0; c < COLS; c++) {
    const col = drops[c];
    for (let i = col.length-1; i >= 0; i--) {
      const d = col[i];
      d.y += d.speed;
      if (Math.random() < 0.08)
        d.chars[Math.random() * d.chars.length | 0] = rc();

      const row = d.y | 0;
      if (row >= ROWS - 1) firstLanded = true;

      if (phase === Phase.FILL && colRows[c].length > 0) {
        const sz = stacks[c].length;
        if (sz < colRows[c].length && row >= colRows[c][sz]) {
          stacks[c].push(rc());
          col.splice(i, 1);
          continue;
        }
      }

      if (row - d.chars.length > ROWS) col.splice(i, 1);
    }
  }

  // Phase transitions
  if (phase === Phase.RAIN) {
    phaseWait++;
    if (firstLanded && phaseWait > 80) { phase = Phase.FILL; playMarch(); }
  }

  if (phase === Phase.FILL) {
    const full = colRows.every((rows, c) => rows.length === 0 || stacks[c].length >= rows.length);
    if (full) { phase = Phase.DRAIN; }
  }

  if (phase === Phase.DRAIN) {
    const anyDrops = drops.some(col => col.length > 0);
    if (!anyDrops) { phase = Phase.HOLD; phaseWait = 0; }
  }

  if (phase === Phase.HOLD) {
    phaseWait++;
    if (phaseWait >= HOLD_FRAMES) { phase = Phase.FADE; fadeAlpha = 0; stopMarch(); }
  }

  if (phase === Phase.FADE) {
    fadeAlpha = Math.min(1, fadeAlpha + 0.02);
    if (fadeAlpha >= 1) phase = Phase.DONE;
  }

  // Flicker
  for (let c = 0; c < COLS; c++) {
    const s = stacks[c];
    if (s.length && Math.random() < 0.003)
      s[Math.random() * s.length | 0] = rc();
  }
}

// ═══════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════
function render() {
  // Motion blur
  ctx.fillStyle = 'rgba(0,0,0,0.05)';
  ctx.fillRect(0, 0, W, H);

  ctx.font = FS + 'px "Courier New", monospace';
  ctx.textAlign = 'left';
  const px = c => c * FS;
  const py = r => r * FS + FS;

  // ── Track top filled row per column for progressive reveal ──
  const topFilled = new Map();
  for (let c = 0; c < COLS; c++) {
    const n = stacks[c].length;
    if (n > 0 && colRows[c].length > 0)
      topFilled.set(c, colRows[c][n-1]);
  }

  function isRevealed(ec, er) {
    if (phase >= Phase.DRAIN) return true;
    for (let nc = Math.max(0,ec-2); nc <= Math.min(COLS-1,ec+2); nc++) {
      if (topFilled.has(nc) && topFilled.get(nc) <= er) return true;
    }
    return false;
  }

  // 1. Death Star outline — revealed by fill
  if (phase >= Phase.FILL) {
    for (const e of edgeCells) {
      if (!isRevealed(e.c, e.r)) continue;
      const sh = shadeGrid[e.r][e.c];
      let g;
      if (e.type === 'outer')       g = (40 + 62*sh) | 0;
      else if (e.type === 'trench') g = (30 + 52*sh) | 0;
      else                          g = (25 + 40*sh) | 0;
      const b = Math.max(2, g/12|0);
      ctx.fillStyle = 'rgb(0,'+g+','+b+')';
      ctx.fillText(e.ch, px(e.c), py(e.r));
    }
  }

  // 2. Settled chars with 3D shading
  for (let c = 0; c < COLS; c++) {
    const s = stacks[c];
    const rows = colRows[c];
    const n = s.length;
    if (!n) continue;
    for (let i = 0; i < n; i++) {
      const r = rows[i];
      const t = n > 1 ? i/(n-1) : 1;
      const sh = shadeGrid[r][c];

      if (i === n-1) {
        const g = (160 + 95*sh) | 0;
        const rr = (160*sh) | 0;
        ctx.fillStyle = 'rgb('+rr+','+g+','+rr+')';
      } else {
        const baseG = (90 + t*155) | 0;
        const g = (baseG * (0.35 + 0.65*sh)) | 0;
        const b = Math.max(2, g/15|0);
        ctx.fillStyle = 'rgb(0,'+g+','+b+')';
      }
      ctx.fillText(s[i], px(c), py(r));
    }
  }

  // 3. Active drops
  for (let c = 0; c < COLS; c++) {
    for (const d of drops[c]) {
      const hr = d.y | 0;
      const len = d.chars.length;
      for (let t = 0; t < len; t++) {
        const r = hr - t;
        if (r < 0 || r >= ROWS) continue;
        if (t === 0) {
          ctx.fillStyle = d.bright ? '#ffffff' : '#ccffcc';
        } else {
          const a = 1 - t/len;
          const g = d.bright ? (220*a)|0 : (180*a)|0;
          ctx.fillStyle = 'rgba(0,'+g+',0,'+a.toFixed(2)+')';
        }
        ctx.fillText(d.chars[t], px(c), py(r));
      }
    }
  }

  // 4. Fade overlay
  if (phase === Phase.FADE || phase === Phase.DONE) {
    ctx.fillStyle = 'rgba(0,0,0,'+fadeAlpha.toFixed(3)+')';
    ctx.fillRect(0, 0, W, H);
  }

  // 5. After fade — show branding
  if (phase === Phase.DONE) {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#00cc33';
    ctx.font = 'bold 28px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('L e a r n I X', W/2, H/2 - 10);
    ctx.font = '12px "Courier New", monospace';
    ctx.fillStyle = '#006600';
    ctx.fillText('[ press any key or click to restart ]', W/2, H/2 + 25);
  }
}

// ═══════════════════════════════════════════════
//  LOOP
// ═══════════════════════════════════════════════
function tick() {
  if (phase !== Phase.DONE) {
    update();
    render();
  }
  requestAnimationFrame(tick);
}
tick();

// Restart on click/key after done
function restart() {
  if (phase !== Phase.DONE) return;
  stopMarch();
  stacks.forEach(s => s.length = 0);
  drops.forEach(d => d.length = 0);
  for (let c = 0; c < COLS; c++)
    if (Math.random() < 0.28) spawnDrop(c);
  phase = Phase.RAIN;
  phaseWait = 0;
  frame = 0;
  fadeAlpha = 0;
  firstLanded = false;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
}
document.addEventListener('keydown', restart);
document.addEventListener('click', restart);

// Handle resize
window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>
</body>
</html>
